          <text x="238" y="282" text-anchor="middle" class="ascii" xml:space="preserve">  .+###############@@@@###############+.  </text>
          <text x="238" y="294" text-anchor="middle" class="ascii" xml:space="preserve">   .*#########+:..:++++:..:+#########*.   </text>
