          <text x="238" y="126" text-anchor="middle" class="ascii" xml:space="preserve">                .:+###+:.                 </text>
          <text x="238" y="138" text-anchor="middle" class="ascii" xml:space="preserve">               .*@@@@@@@*.                </text>
          <text x="238" y="150" text-anchor="middle" class="ascii" xml:space="preserve">               :@@@@@@@@@:                </text>
          <text x="238" y="162" text-anchor="middle" class="ascii" xml:space="preserve">          ..::..+*#####*+..::..           </text>
          <text x="238" y="174" text-anchor="middle" class="ascii" xml:space="preserve">       .:+*####################*+:.       </text>
          <text x="238" y="186" text-anchor="middle" class="ascii" xml:space="preserve">     .:############################:.     </text>
