<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" fill="none" role="img" aria-label="K-sewii - Software Engineering Student GitHub Profile Banner (Dark Theme)">
  <defs>
    <!-- Background & Surface Gradients -->
    <linearGradient id="bg-dark" x1="0" y1="0" x2="1180" y2="610" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#07111F" />
      <stop offset="100%" stop-color="#0B1220" />
    </linearGradient>

    <radialGradient id="glow-violet" cx="0.22" cy="0.3" r="0.55">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-cyan" cx="0.82" cy="0.72" r="0.6">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="border-shimmer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.65" />
    </linearGradient>

    <linearGradient id="glass-card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.68" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.42" />
    </linearGradient>

    <linearGradient id="ascii-tint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="18%" stop-color="#F43F5E" />
      <stop offset="22%" stop-color="#F8FAFC" />
      <stop offset="68%" stop-color="#E2E8F0" />
      <stop offset="72%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <linearGradient id="scanline-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0" />
      <stop offset="50%" stop-color="#22D3EE" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0" />
    </linearGradient>

    <!-- Subtle Tech Grid Pattern -->
    <pattern id="grid-dark" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#94A3B8" stroke-width="0.6" stroke-opacity="0.06" />
    </pattern>

    <!-- Fine Scanline Overlay -->
    <pattern id="crt-lines" width="4" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="4" y2="0" stroke="#000000" stroke-width="1.2" stroke-opacity="0.25" />
    </pattern>

    <!-- Clip Paths -->
