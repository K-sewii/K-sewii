          <text x="238" y="330" text-anchor="middle" class="ascii" xml:space="preserve">       .:+########*+**+*########+:.       </text>
          <text x="238" y="342" text-anchor="middle" class="ascii" xml:space="preserve">      .:+###*+==============+*###+:.      </text>
          <text x="238" y="354" text-anchor="middle" class="ascii" xml:space="preserve">     .*#####+::::::::::::::::+#####*.     </text>
          <text x="238" y="366" text-anchor="middle" class="ascii" xml:space="preserve">    .+#######*==============*#######+.    </text>
          <text x="238" y="378" text-anchor="middle" class="ascii" xml:space="preserve">   .*#########*+::::::::::+*#########*.   </text>
          <text x="238" y="390" text-anchor="middle" class="ascii" xml:space="preserve">  .+############*========*############+.  </text>
          <text x="238" y="402" text-anchor="middle" class="ascii" xml:space="preserve">  :###############*====*###############:  </text>
          <text x="238" y="414" text-anchor="middle" class="ascii" xml:space="preserve"> :#################*==*#################: </text>
          <text x="238" y="426" text-anchor="middle" class="ascii" xml:space="preserve"> :##################**##################: </text>
