<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="610" viewBox="0 0 1180 610" fill="none" role="img" aria-label="K-sewii - Software Engineering Student GitHub Profile Banner (Light Theme)">
  <defs>
    <!-- Light Background & Surface Gradients -->
    <linearGradient id="bg-light" x1="0" y1="0" x2="1180" y2="610" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#EEF6FF" />
    </linearGradient>

    <radialGradient id="glow-blue-light" cx="0.22" cy="0.3" r="0.55">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-cyan-light" cx="0.82" cy="0.72" r="0.6">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="border-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.45" />
