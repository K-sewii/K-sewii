      <stop offset="18%" stop-color="#BE123C" />
      <stop offset="22%" stop-color="#1E293B" />
      <stop offset="68%" stop-color="#334155" />
      <stop offset="72%" stop-color="#92400E" />
      <stop offset="100%" stop-color="#78350F" />
